<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch Books</title>
</head>

<body>
  <div id="content"></div>
</body>

<script>
  const keyword = [
     'Đắc nhân tâm'
  ]; // 🔁 có thể thay đổi bằng input, v.v.
  let total = 0;
  function handleResponse(response) {
    // console.log(response);
    for (let i = 0; i < response.items.length; i++) {
      const item = response.items[i];
      //   console.log({
      //     title: item.volumeInfo.title,
      //     description: item.volumeInfo.description,
      //     category: item.volumeInfo.categories,
      //   });
      console.log(item)
      const title = item.volumeInfo.title;
      const description = item.volumeInfo.description || "";
      const subtitle = item.volumeInfo.subtitle || ""; // Có thể không có subtitle
      const category = item.volumeInfo.categories;
      const author = item.volumeInfo.authors ? item.volumeInfo.authors.join(", ") : "Unknown Author";
      const pages = item.volumeInfo.pageCount || "Unknown Pages";
      const publishedDate = item.volumeInfo.publishedDate || "Unknown Date";
      const language = item.volumeInfo.language || "Unknown Language";
      const imageLink = item.volumeInfo.imageLinks
        ? item.volumeInfo.imageLinks.thumbnail || item.volumeInfo.imageLinks.smallThumbnail
        : "No Image";
      const hasDesOrSub = description || subtitle;
      if (!hasDesOrSub || !category || imageLink == "No Image") {
        continue; // Bỏ qua nếu không có mô tả
      }
      total++;
      document.getElementById("content").innerHTML += `<hr> Title:${title}
        <br> Subtitle: ${subtitle}
        <br> Description: ${description} 
        <br> Category: ${category}
        <br> Author: ${author}
        <br> Published: ${publishedDate}
        <br> Language: ${language}
        <br> Image: 
        <br>
        <a href="${imageLink}" target="_blank"><img src="${imageLink}" alt="Book Image"</a>
        <br> <a href="${imageLink}" target="_blank">Image Info</a>
        <br> Pages: ${pages}`;
    }
      console.log(total);
  }

  const script = document.createElement("script");
  script.src = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(
    keyword
  )}&startIndex=0&maxResults=20&callback=handleResponse`;
  document.body.appendChild(script);
</script>

</script>

</html>
